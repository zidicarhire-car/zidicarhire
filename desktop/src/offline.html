<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <title>ZidiCarHire: offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #F3F5F7; --card: #fff; --text: #1C2340; --muted: #5A6380; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12162B; --card: #1B2140; --text: #E8EBF5; --muted: #A3ABC6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 420px; margin: 24px; padding: 32px; border-radius: 16px; background: var(--card); text-align: center;
      box-shadow: 0 8px 30px rgb(0 0 0 / .08); }
    .plate { display: inline-block; padding: 4px 14px; border: 3px solid #000; border-radius: 8px; background: #F6C21C; color: #000;
      font: 800 26px/1.2 "Segoe UI", sans-serif; letter-spacing: .04em; }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 10px; background: #1C2340; color: #fff;
      font: 600 16px "Segoe UI", sans-serif; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { background: #E8EBF5; color: #1C2340; } }
    button:focus-visible { outline: 3px solid #F6C21C; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="plate" aria-hidden="true">ZIDI</span>
    <h1>You're offline</h1>
    <p>ZidiCarHire needs the internet to show cars and take bookings. Check your connection, then try again.</p>
    <button type="button" id="retry" autofocus>Try again</button>
  </main>
  <script>
    const target = new URLSearchParams(location.search).get('retry') || '';
    const go = () => { if (/^https?:\/\//.test(target)) location.href = target; };
    document.getElementById('retry').addEventListener('click', go);
    window.addEventListener('online', go);
  </script>
</body>
</html>
