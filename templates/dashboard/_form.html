{# Any dashboard form, Bootstrap style: long fields full width, the rest in two columns from 576px. #}
{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
<div class="row gx-3">
  {% for field in form %}
  <div class="{% if field.widget_type == 'textarea' or field.widget_type == 'checkboxselectmultiple' or field.widget_type == 'url' or field.widget_type == 'checkbox' %}col-12{% else %}col-sm-6{% endif %}">
    {% include "_field.html" %}
  </div>
  {% endfor %}
</div>
