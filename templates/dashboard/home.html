{% extends "dashboard/base.html" %}
{% block title %}Overview{% endblock %}
{% block content %}
<header class="dash-head">
  <div>
    <h1>Today {% if view_location %}in {{ view_location.name }}{% endif %}</h1>
    <p class="head-date">{{ today|date:"l j F" }}</p>
  </div>
  <p class="live-note"><span class="live-dot" aria-hidden="true"></span> Updates live. New paid bookings play a sound.</p>
</header>
<div data-live>
  {% include "dashboard/_overview.html" %}
</div>
{% endblock %}
