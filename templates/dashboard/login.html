{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in | ZIDICARHIRE</title>
  <link rel="icon" href="{% static 'img/zidicarhire-favicon.svg' %}" type="image/svg+xml">
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo only-light" src="{% static 'img/zidicarhire-logo.svg' %}" alt="ZidiCarHire" width="192" height="48">
    <img class="login-logo only-dark" src="{% static 'img/zidicarhire-logo-white.svg' %}" alt="ZidiCarHire" width="192" height="48">
    <h1>Sign in to the dashboard</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<p class="form-error">{{ form.non_field_errors|join:" " }}</p>{% endif %}
      <label>Username<input name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
