<div class="chat" id="chat" data-start-url="{% url 'chat:start' %}" data-base-url="/chat/">
  <div class="chat-buttons">
  {% if business.whatsapp %}
  <a class="wa-float" href="https://wa.me/{{ business.whatsapp }}?text={{ 'Hi, I would like to hire a car.'|urlencode }}" target="_blank" rel="noopener" aria-label="WhatsApp us">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.4.4 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.4-.3z"/></svg>
    <span>WhatsApp</span>
  </a>
  {% endif %}
  <button class="chat-launcher" id="chat-launcher" type="button" aria-expanded="false" aria-controls="chat-panel">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Chat with us</span>
    <span class="chat-dot" id="chat-dot" hidden></span>
  </button>
  </div>
  <section class="chat-panel" id="chat-panel" hidden aria-label="Live chat">
    <header class="chat-head">
      <div>
        <strong>ZIDICARHIRE</strong>
        <span class="chat-presence" id="chat-presence">We usually reply within a few minutes</span>
      </div>
      <button type="button" class="icon-btn" id="chat-close" aria-label="Close chat">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <form class="chat-intro" id="chat-intro" novalidate>
      <p>Get instant answers about prices, booking and payment, or talk to our team. Tell us who you are so we can follow up.</p>
      <label>Your name<input name="name" autocomplete="name" required maxlength="80"></label>
      <label>Phone or email <span class="optional">(optional)</span><input name="contact" maxlength="120"></label>
      {% if branches %}
      <label>Which city? <span class="optional">(optional)</span>
        <select name="city">
          <option value="">Not sure yet</option>
          {% for branch in branches %}<option value="{{ branch.slug }}">{{ branch.name }}</option>{% endfor %}
        </select>
      </label>
      {% endif %}
      <p class="form-error" id="chat-intro-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Start chat</button>
    </form>

    <div class="chat-thread" id="chat-thread" hidden>
      <ol class="chat-messages" id="chat-messages" aria-live="polite"></ol>
      <div class="chat-quick" id="chat-quick" role="group" aria-label="Quick questions">
        <button type="button" class="chip chip-agent" id="chat-agent">Talk to a person</button>
        <button type="button" class="chip" data-ask="What are your prices?">Prices</button>
        <button type="button" class="chip" data-ask="How do I book a car?">How to book</button>
        <button type="button" class="chip" data-ask="How do I pay with M-Pesa?">Payment</button>
        <button type="button" class="chip" data-ask="What documents do I need?">Documents</button>
        <button type="button" class="chip" data-ask="Where can I pick up the car?">Pick-up places</button>
      </div>
      <form class="chat-compose" id="chat-compose">
        <label class="sr-only" for="chat-input">Message</label>
        <textarea id="chat-input" rows="1" maxlength="1000" placeholder="Type a message"></textarea>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </div>
  </section>
</div>
