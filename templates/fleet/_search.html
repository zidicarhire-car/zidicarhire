{# Search card: city, dates, car type. One row on desktop, 2 x 2 on tablets, stacked on phones. #}
<form class="search-card" id="search" method="get" action="{% url 'fleet:cars' %}"
  data-city="{{ location.slug }}" data-explicit-city="{{ explicit_city|yesno:'1,0' }}">
  <div class="row g-2 g-md-3">
    <div class="col-12 col-md-6 col-lg">
      <label class="form-label" for="s-city">City</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-geo-alt" aria-hidden="true"></i></span>
        <select class="form-select" id="s-city" name="city" required>
          {% for loc in locations %}<option value="{{ loc.slug }}"{% if loc == location %} selected{% endif %}>{{ loc.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg">
      <label class="form-label" for="s-from">Pick-up date</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-calendar3" aria-hidden="true"></i></span>
        <input class="form-control" type="date" id="s-from" name="from" value="{{ start|date:'Y-m-d' }}" min="{{ today|date:'Y-m-d' }}" required aria-describedby="search-days">
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg">
      <label class="form-label" for="s-to">Return date</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-calendar3" aria-hidden="true"></i></span>
        <input class="form-control" type="date" id="s-to" name="to" value="{{ end|date:'Y-m-d' }}" min="{{ today|date:'Y-m-d' }}" required aria-describedby="search-days">
      </div>
    </div>
    {% if not hide_category %}
    <div class="col-12 col-md-6 col-lg">
      <label class="form-label" for="s-category">Car type</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-car-front" aria-hidden="true"></i></span>
        <select class="form-select" id="s-category" name="category">
          <option value="">Any type</option>
          {% for value, label in categories %}<option value="{{ value }}"{% if value == category %} selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
    </div>
    {% endif %}
    <div class="col-12 col-lg-auto d-flex align-items-end">
      <button class="btn btn-plate w-100 search-btn" type="submit"><i class="bi bi-search" aria-hidden="true"></i>Search cars</button>
    </div>
  </div>
  <p class="search-days" id="search-days" aria-live="polite"><i class="bi bi-clock" aria-hidden="true"></i><span data-days>{{ days }} day{{ days|pluralize }}</span></p>
</form>
