{% load static %}{# Shared <head> assets for every page. Include it before the page's own stylesheet. #}
  <script>
    /* Light or dark before first paint: the visitor's saved choice, otherwise the device setting. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('zch-theme'); } catch (e) { /* storage blocked */ }
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
  {# Bootstrap 5.3.3, Bootstrap Icons 1.11.3 and the fonts come from our own domain (built by tools/build_vendor.py). #}
  <link rel="preload" href="{% static 'vendor/inter.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'vendor/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons.css' %}">
  <script defer src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
